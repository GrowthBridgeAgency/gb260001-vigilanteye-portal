<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Shree Sawariya CCTV Security Services</title>
  <meta name="description" content="Explore our catalog of top-tier security equipment, including CCTV, Biometrics, and Access Control systems.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Products Page Specific Styles */
    .products-layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 3rem;
      margin-top: 2rem;
    }

    .products-sidebar {
      background: var(--surface-light);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .filter-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .filter-list li {
      margin-bottom: 0.75rem;
    }

    .filter-list button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      padding: 0.5rem;
      border-radius: 8px;
      transition: var(--transition);
    }

    .filter-list button:hover, .filter-list button.active {
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      font-weight: 500;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--surface-light);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .product-image-container {
      height: 250px;
      background: rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
    }

    .product-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image-container img {
      transform: scale(1.05);
    }

    .product-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--primary-color);
      color: var(--bg-main);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .product-info {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-brand {
      color: var(--accent-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .products-layout {
        grid-template-columns: 1fr;
      }
      .products-sidebar {
        position: relative;
        top: 0;
      }
    }
  </style>
</head>
<body class="dark-theme">

  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

  <main>
    <section class="py-5 bg-alt" style="padding-top: 8rem !important; padding-bottom: 6rem !important;">
      <div class="container text-center" style="margin-bottom: 2rem;">
        <h1 style="font-size: 3.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1rem;">Our Products</h1>
        <p style="margin: 0 auto; font-size: 1.1rem; color: var(--text-muted); max-width: 600px;">Browse our extensive catalog of professional security equipment and systems.</p>
      </div>

      <div class="container">
        <div class="products-layout">
          <!-- Sidebar -->
          <aside class="products-sidebar">
            <h3 class="sidebar-title">Categories</h3>
            <ul class="filter-list" id="category-filters">
              <li><button class="active" data-filter="all">All Products</button></li>
              <li><button data-filter="CCTV Camera">CCTV Camera</button></li>
              <li><button data-filter="DVR">DVR</button></li>
              <li><button data-filter="NVR">NVR</button></li>
              <li><button data-filter="Biometric System">Biometric System</button></li>
              <li><button data-filter="Video Door Phone">Video Door Phone</button></li>
              <li><button data-filter="Access Control System">Access Control System</button></li>
              <li><button data-filter="Smart Door Lock">Smart Door Lock</button></li>
              <li><button data-filter="Networking Equipment">Networking Equipment</button></li>
              <li><button data-filter="Storage Device">Storage Device</button></li>
              <li><button data-filter="Security Alarm System">Security Alarm System</button></li>
              <li><button data-filter="Fire Alarm System">Fire Alarm System</button></li>
              <li><button data-filter="Intercom System">Intercom System</button></li>
              <li><button data-filter="Power Supply & Accessories">Power Supply & Accessories</button></li>
              <li><button data-filter="Security Package">Security Package</button></li>
              <li><button data-filter="Other">Other</button></li>
            </ul>
          </aside>

          <!-- Main Grid -->
          <div class="products-grid" id="products-grid-container">
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">Loading products...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal-overlay">
      <div class="modal-content glass-showcase-modal">
        <span class="close-modal" onclick="window.closeModal('product-modal')">&times;</span>
        
        <div class="showcase-modal-split">
          <div class="showcase-modal-left">
            <div class="image-glow-ring"></div>
            <img id="modal-prod-img" src="" alt="Product Showcase" class="prod-modal-img-style">
          </div>
          
          <div class="showcase-modal-right">
            <div class="showcase-brand-category">
              <span id="modal-prod-brand"></span>
            </div>
            <h2 id="modal-prod-title"></h2>
            
            <div id="modal-prod-badge-container"></div>
            
            <div class="showcase-section">
              <h4 class="showcase-label">MODEL</h4>
              <div id="modal-prod-model" class="showcase-value"></div>
            </div>
            
            <div class="showcase-section">
              <h4 class="showcase-label">DESCRIPTION</h4>
              <div id="modal-prod-desc" class="showcase-value-small"></div>
            </div>
            
            <div class="showcase-section" id="modal-prod-specs-container">
              <h4 class="showcase-label">SPECIFICATIONS</h4>
              <div id="modal-prod-specs" class="showcase-value-small"></div>
            </div>
            
            <div class="showcase-footer">
              <div>
                <h4 class="showcase-label">PRICE</h4>
                <div id="modal-prod-price" class="showcase-price"></div>
              </div>
              <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="btn showcase-cta" style="background-color: #25D366; color: #fff; border-color: #25D366;" onclick="window.open('https://wa.me/919876543210?text=I am interested in knowing more about the product: ' + document.getElementById('modal-prod-title').innerText, '_blank')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:0.5rem; vertical-align:middle;"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964 1.003-3.582c-.605-1.052-.922-2.256-.922-3.473 0-4.661 3.792-8.452 8.45-8.452 4.659 0 8.452 3.791 8.452 8.452 0 4.66-3.793 8.452-8.452 8.452z"/></svg>
                  WhatsApp
                </button>
                <button class="btn btn-outline" onclick="window.openProductEnquiryModal()">Enquire Now</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

    <!-- Product Enquiry Modal -->
    <div id="enquiry-modal" class="modal-overlay">
      <div class="modal-content glass-card" style="max-width: 500px; padding: 2.5rem; text-align: left;">
        <span class="close-modal" onclick="window.closeModal ? window.closeModal('enquiry-modal') : document.getElementById('enquiry-modal').classList.remove('active')">&times;</span>
        <h2 style="margin-bottom: 0.5rem; color: var(--text-main);">Product Enquiry</h2>
        <p style="color: var(--accent-color); margin-bottom: 1.5rem; font-weight: 500;" id="enquiry-product-subtitle"></p>
        
        <form id="product-enquiry-form">
          <input type="hidden" id="enq_product_name">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="enq_name" style="color: var(--text-muted); font-size: 0.85rem;">Full Name</label>
            <input type="text" id="enq_name" class="form-control" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;" required>
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="enq_mobile" style="color: var(--text-muted); font-size: 0.85rem;">Mobile Number</label>
            <input type="tel" id="enq_mobile" class="form-control" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;" required>
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="enq_location" style="color: var(--text-muted); font-size: 0.85rem;">Location / City</label>
            <input type="text" id="enq_location" class="form-control" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;" required>
          </div>
          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="enq_message" style="color: var(--text-muted); font-size: 0.85rem;">Additional Message</label>
            <textarea id="enq_message" class="form-control" rows="3" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;" placeholder="Any specific requirements?"></textarea>
          </div>
          <button type="submit" id="btn-submit-prod-enquiry" class="btn btn-primary" style="width: 100%;">Submit Enquiry</button>
        </form>
      </div>
    </div>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="js/component-loader.js"></script>
  <script type="module" src="js/products.js"></script>
  <script type="module" src="js/product-enquiry.js"></script>
</body>
</html>
