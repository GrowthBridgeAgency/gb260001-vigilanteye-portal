<div class="dashboard-utility-bar" style="display: flex; justify-content: flex-end; padding: 1.5rem 3rem 0 3rem; position: relative; z-index: 50;">
  <div class="floating-notification-widget">
  <div class="notification-bell-container" id="notification-bell" onclick="document.getElementById('notification-dropdown').classList.toggle('show')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <div class="notification-badge" id="notification-badge" style="display: none;">0</div>
  </div>

  <div class="notification-dropdown" id="notification-dropdown">
    <div class="notification-header">
      <h3>Notifications</h3>
      <button onclick="window.notificationService.markAllAsRead()">Mark all as read</button>
    </div>
    <div class="notification-list" id="notification-list">
      <!-- Loading Skeleton -->
      <div style="padding: 1rem; display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; gap: 1rem; align-items: center; animation: pulse 1.5s infinite;">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.05);"></div>
          <div style="flex: 1;">
            <div style="height: 12px; background: rgba(255,255,255,0.05); border-radius: 4px; width: 60%; margin-bottom: 8px;"></div>
            <div style="height: 10px; background: rgba(255,255,255,0.05); border-radius: 4px; width: 40%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
