<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service History | SafeVision Surveillance</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .outcome-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .outcome-completed { background: rgba(34,197,94,0.1); color: #86efac; }
    .outcome-partial { background: rgba(245,158,11,0.1); color: #fcd34d; }
    .outcome-followup { background: rgba(239,68,68,0.1); color: #fca5a5; }
    .outcome-parts { background: rgba(168,85,247,0.1); color: #d8b4fe; }
    .outcome-amc { background: rgba(56,189,248,0.1); color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="customer-sidebar-placeholder"></div>

    <main class="dashboard-main">
      <div id="customer-header-placeholder"></div>

      <div class="dashboard-content">
        <h1 style="margin-top:0; margin-bottom:1.5rem;">Service History</h1>
        
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table class="data-table" id="services-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Service Type</th>
                  <th>Outcome</th>
                  <th>Technician</th>
                  <th>Product</th>
                  <th style="text-align: center;">Details</th>
                </tr>
              </thead>
              <tbody id="services-tbody">
                <tr><td colspan="6" style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading history...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- View Details Modal -->
  <div class="modal-overlay" id="view-modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2>Service Report</h2>
        <button class="modal-close" onclick="window.closeModal('view-modal')">&times;</button>
      </div>
      <div class="modal-body" id="view-modal-body">
        <!-- Injected via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="window.closeModal('view-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/component-loader.js"></script>
  <script type="module" src="../js/customer-service-history.js"></script>
  <script>
    window.openModal = function(id) { document.getElementById(id).classList.add('active'); }
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
