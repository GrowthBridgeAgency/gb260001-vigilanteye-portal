<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints | VigilantEye</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .status-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
    }
    .status-open { background: rgba(14, 165, 233, 0.1); color: #7dd3fc; border-color: rgba(14, 165, 233, 0.2); }
    .status-assigned { background: rgba(168, 85, 247, 0.1); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.2); }
    .status-progress { background: rgba(245, 158, 11, 0.1); color: #fcd34d; border-color: rgba(245, 158, 11, 0.2); }
    .status-resolved { background: rgba(34, 197, 94, 0.1); color: #86efac; border-color: rgba(34, 197, 94, 0.2); }
    .status-closed { background: rgba(107, 114, 128, 0.1); color: #d1d5db; border-color: rgba(107, 114, 128, 0.2); }

    .priority-low { color: #86efac; }
    .priority-medium { color: #fcd34d; }
    .priority-high { color: #fca5a5; }

    /* Modals CSS mapping from admin if not loaded globally */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--bg-main); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--border-radius); width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { margin: 0; font-size: 1.25rem; }
    .modal-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; line-height: 1; }
    .modal-close:hover { color: var(--text-main); }
    .modal-body { padding: 1.5rem; color: var(--text-muted); line-height: 1.6; }
    .modal-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: flex-end; gap: 1rem; }

    /* Light Theme Modals */
    body[data-theme="light"] .modal-content { background: #fff; border-color: rgba(0,0,0,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    body[data-theme="light"] .modal-header, body[data-theme="light"] .modal-footer { border-color: rgba(0,0,0,0.05); }
    body[data-theme="light"] .modal-close { color: #64748b; }
    body[data-theme="light"] .modal-close:hover { color: #0f172a; }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="customer-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="customer-header-placeholder"></div>

      <div class="dashboard-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap:wrap; gap:1rem;">
          <h1 style="margin: 0;">My Complaints</h1>
          <button class="btn btn-primary" onclick="openModal('raise-modal')" style="white-space: nowrap;">Raise New Complaint</button>
        </div>
        
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="overflow-x:auto;">
            <table class="data-table" id="complaints-table">
              <thead>
                <tr>
                  <th>Ticket No.</th>
                  <th>Product</th>
                  <th>Issue Type</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Warranty/AMC</th>
                  <th>Created Date</th>
                </tr>
              </thead>
              <tbody id="complaints-tbody">
                <tr><td colspan="7" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading complaints...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- RAISE NEW COMPLAINT MODAL -->
  <div class="modal-overlay" id="raise-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Raise New Complaint</h2>
        <button class="modal-close" onclick="closeModal('raise-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="raise-form">
          <div class="grid-2" style="gap: 1.5rem; margin-bottom: 1.5rem;">
            <div>
              <label>Select Product *</label>
              <select id="complaint_product" class="form-control" required>
                <option value="" disabled selected>-- Loading Products... --</option>
              </select>
            </div>
            <div>
              <label>Issue Type *</label>
              <select id="complaint_issue_type" class="form-control" required>
                <option value="Camera Offline">Camera Offline</option>
                <option value="Recording Issue">Recording Issue</option>
                <option value="DVR/NVR Issue">DVR/NVR Issue</option>
                <option value="Storage Issue">Storage Issue</option>
                <option value="Network Issue">Network Issue</option>
                <option value="AMC Support">AMC Support</option>
                <option value="Warranty Support">Warranty Support</option>
                <option value="Installation Issue">Installation Issue</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <label>Priority</label>
          <select id="complaint_priority" class="form-control" style="margin-bottom: 1.5rem;" required>
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>

          <label>Description of Issue *</label>
          <textarea id="complaint_desc" class="form-control" rows="4" required placeholder="Please describe the problem in detail..."></textarea>

          <div class="grid-2" style="gap: 1.5rem; margin-top: 1.5rem;">
            <div>
              <label>Upload Photo (Optional)</label>
              <input type="file" id="complaint_image" class="form-control" accept="image/png, image/jpeg, image/jpg, image/webp">
            </div>
            <div>
              <label>Upload Video (Optional)</label>
              <input type="file" id="complaint_video" class="form-control" accept="video/mp4, video/quicktime">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('raise-modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-submit-complaint">Submit Complaint</button>
      </div>
    </div>
  </div>

  <!-- VIEW COMPLAINT DETAILS MODAL -->
  <div class="modal-overlay" id="view-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h2 id="view-ticket-no">Ticket Details</h2>
        <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
      </div>
      <div class="modal-body" id="view-modal-body">
        <!-- Injected via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('view-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/component-loader.js"></script>
  <script type="module" src="/js/customer-complaints.js"></script>

  <script>
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
