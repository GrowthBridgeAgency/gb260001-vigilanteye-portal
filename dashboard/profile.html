<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile & Settings | SafeVision Surveillance</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    /* Profile Page Specific Styles */
    .settings-container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .settings-header {
      padding: 2.5rem;
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .settings-section {
      padding: 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .settings-section:last-child {
      border-bottom: none;
    }

    .settings-section-title {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .settings-form-group {
      margin-bottom: 1.5rem;
    }
    .settings-form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .settings-input {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      color: #fff;
      padding: 0.9rem 1.15rem;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.3s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .settings-input:focus {
      background: rgba(0, 0, 0, 0.25);
      border-color: var(--accent-color);
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 107, 0, 0.1);
    }

    /* Completion Ring */
    .completion-ring-container {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .completion-ring-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .completion-ring-circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 4;
    }
    .completion-ring-circle {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 175.93;
      stroke-dashoffset: 175.93;
      transition: stroke-dashoffset 1s ease-in-out, stroke 0.3s ease;
    }
    .completion-ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
    }
    
    .health-score-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .health-excellent { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25); }
    .health-good { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
    .health-attention { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    .health-critical { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }

  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="customer-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="customer-header-placeholder"></div>

      <div class="dashboard-content">
        
        <div id="profile-hero" style="margin-bottom: 4rem;">
          <h1 id="profile-greeting" style="margin: 0; font-size: 2.2rem; font-weight: 300; letter-spacing: -0.02em;">Profile & Settings</h1>
          <p style="margin: 0.5rem 0 0 0; color: var(--text-muted); font-size: 1rem; max-width: 500px; line-height: 1.5;">Manage your personal information and account security.</p>
          
          <div style="display: flex; gap: 3rem; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
             <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.25rem;">Role</div>
                <div id="read_role" style="font-weight: 400; color: var(--accent-color); text-transform: capitalize; font-size: 1.1rem;">Loading...</div>
             </div>
             <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.25rem;">Email</div>
                <div id="read_email" style="font-weight: 400; color: #fff; font-size: 1.1rem;">Loading...</div>
             </div>
             <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.25rem;">Member Since</div>
                <div id="read_since" style="font-weight: 400; color: #fff; font-size: 1.1rem;">Loading...</div>
             </div>
          </div>
        </div>

        <div class="profile-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;">
          
          <!-- Column 1: Personal Info -->
          <div>
            <h3 style="margin: 0 0 2rem 0; font-size: 1.1rem; font-weight: 400; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; display:flex; align-items:center; gap:0.5rem;">
              Personal Information
            </h3>
            <form id="profile-form">
              <div class="form-group" style="margin-bottom: 2rem;">
                <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Full Name</label>
                <input type="text" id="prof_name" required placeholder="Loading..." style="width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 0; font-size: 1.1rem; outline: none; transition: border-color 0.3s; font-family: inherit;" onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
              </div>
              <div class="form-group" style="margin-bottom: 2.5rem;">
                <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Phone Number</label>
                <input type="tel" id="prof_phone" placeholder="Enter phone number" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 0; font-size: 1.1rem; outline: none; transition: border-color 0.3s; font-family: inherit;" onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
              </div>
              <button type="submit" class="btn btn-primary" id="btn-save-profile" style="border-radius: 4px; padding: 0.75rem 2rem; font-weight: 500; font-family: inherit;">Save Changes</button>
            </form>
          </div>

          <!-- Column 2: Security & Session -->
          <div style="display: flex; flex-direction: column; gap: 4rem;">
            <div>
              <h3 style="margin: 0 0 2rem 0; font-size: 1.1rem; font-weight: 400; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; display:flex; align-items:center; gap:0.5rem;">
                Security Settings
              </h3>
              <form id="password-form">
                <div class="form-group" style="margin-bottom: 2rem;">
                  <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">New Password</label>
                  <div style="position: relative;">
                    <input type="password" id="sec_password" required minlength="8" placeholder="••••••••" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 2.5rem 0.5rem 0; font-size: 1.1rem; outline: none; transition: border-color 0.3s; font-family: inherit;" onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
                    <button type="button" onclick="const input = document.getElementById('sec_password'); const isPwd = input.type === 'password'; input.type = isPwd ? 'text' : 'password'; this.innerHTML = isPwd ? '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>' : '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>';" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; height: 100%;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>
                <div class="form-group" style="margin-bottom: 2.5rem;">
                  <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Confirm Password</label>
                  <div style="position: relative;">
                    <input type="password" id="sec_confirm" required minlength="8" placeholder="••••••••" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 2.5rem 0.5rem 0; font-size: 1.1rem; outline: none; transition: border-color 0.3s; font-family: inherit;" onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
                    <button type="button" onclick="const input = document.getElementById('sec_confirm'); const isPwd = input.type === 'password'; input.type = isPwd ? 'text' : 'password'; this.innerHTML = isPwd ? '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>' : '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>';" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; height: 100%;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>
                <button type="submit" class="btn btn-outline" id="btn-save-password" style="border-radius: 4px; padding: 0.75rem 2rem; font-weight: 500; font-family: inherit;">Update Password</button>
              </form>
            </div>

            <div>
              <h3 style="margin: 0 0 2rem 0; font-size: 1.1rem; font-weight: 400; color: #ef4444; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; display:flex; align-items:center; gap:0.5rem;">
                Session Management
              </h3>
              <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1.5rem; line-height: 1.5;">End your active session securely and return to the login page.</p>
              <button class="btn" onclick="logout()" style="border: 1px solid rgba(239, 68, 68, 0.3); color:#ef4444; background: transparent; border-radius: 4px; padding: 0.75rem 2rem; font-weight: 500; font-family: inherit; transition: all 0.3s;" onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'" onmouseout="this.style.background='transparent'">Logout from Account</button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="../js/component-loader.js"></script>
  <script type="module" src="../js/toast.js"></script>
  <script type="module" src="../js/customer-profile.js"></script>
</body>
</html>
