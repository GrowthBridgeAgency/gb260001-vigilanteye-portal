<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | SafeVision Surveillance</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    /* Typography Overrides */
    h1, h2, h3, h4, h5, h6, .metric-value, .stat-value {
      font-family: 'Outfit', sans-serif !important;
    }

    /* Welcome Hero Card */
    .welcome-hero-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      gap: 2rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
    .welcome-hero-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(20px);
      pointer-events: none;
      border-radius: 50%;
    }

    /* Health Badge overrides */
    .health-score-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1.15rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.75rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .health-excellent { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25); }
    .health-good { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
    .health-attention { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    .health-critical { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }

    /* Skeleton Loading effect */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Snapshot low profile style */
    .snapshot-card {
      background: rgba(255, 255, 255, 0.01) !important;
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      border-radius: 16px !important;
      padding: 1.5rem 2rem !important;
      margin-bottom: 2.5rem !important;
    }
    .snapshot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .snapshot-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .snapshot-grid { grid-template-columns: 1fr; } }

    /* KPI Grid decluttering */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .kpi-grid { grid-template-columns: 1fr; } }

    /* Metric Cards */
    .metric-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.015) 0%, rgba(255, 255, 255, 0.005) 100%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .metric-card:hover {
      border-color: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(56, 189, 248, 0.05);
    }
    .metric-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .metric-value {
      font-size: 1.75rem;
      font-weight: 600;
      color: #fff;
      margin-top: 0.5rem;
    }

    /* Alert cards left border coding */
    .alert-card {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    .alert-card:hover {
      transform: translateX(4px);
    }
    .alert-warning {
      background: rgba(245, 158, 11, 0.02);
      border: 1px solid rgba(245, 158, 11, 0.12);
      border-left: 4px solid #f59e0b;
    }
    .alert-danger {
      background: rgba(239, 68, 68, 0.02);
      border: 1px solid rgba(239, 68, 68, 0.12);
      border-left: 4px solid #ef4444;
    }

    /* Timelines & lists */
    .activity-item {
      display: flex;
      gap: 1.25rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      align-items: center;
      transition: all 0.2s ease;
    }
    .activity-item:hover {
      transform: translateX(4px);
    }
    .activity-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="customer-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="customer-header-placeholder"></div>

      <div class="dashboard-content">
        
        <!-- Compact Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 id="welcome-greeting" style="margin: 0; font-size: 1.75rem; font-weight: 500; letter-spacing: -0.02em;">Dashboard Overview</h1>
            <div id="health-score-container">
              <div class="skeleton" style="width: 160px; height: 32px; border-radius: 20px; margin-top: 0.75rem;"></div>
            </div>
          </div>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="../dashboard/complaints.html" class="btn btn-primary" style="font-size:0.75rem; padding: 0.6rem 1.25rem; border-radius: 8px;">Request Support</a>
            <a href="../dashboard/products.html" class="btn btn-outline" style="font-size:0.75rem; padding: 0.6rem 1.25rem; border-radius: 8px;">My Hardware</a>
          </div>
        </div>

        <!-- Metrics Grid (No wrapper) -->
        <div class="kpi-grid" id="kpi-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
          <!-- Skeletons x 5 -->
          <div style="flex: 1;"><div class="skeleton" style="height:12px; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:28px; width:40%;"></div></div>
          <div style="flex: 1;"><div class="skeleton" style="height:12px; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:28px; width:40%;"></div></div>
          <div style="flex: 1;"><div class="skeleton" style="height:12px; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:28px; width:40%;"></div></div>
          <div style="flex: 1;"><div class="skeleton" style="height:12px; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:28px; width:40%;"></div></div>
          <div style="flex: 1;"><div class="skeleton" style="height:12px; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:28px; width:40%;"></div></div>
        </div>

        <div class="grid-2" style="align-items: start; margin-top: 1rem;">
          <!-- Left Column -->
          <div style="display: flex; flex-direction: column; gap: 2.5rem;">
            <!-- AMC & Warranty Alerts -->
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.75rem;">
                <h3 style="margin:0; font-size:1.15rem; font-weight: 500; display:flex; align-items:center; gap:0.5rem;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-orange"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                  Contract Alerts
                </h3>
                <a href="../dashboard/amc.html" style="font-size:0.8rem; color:var(--accent-color); font-weight: 500;">View All</a>
              </div>
              <div id="alerts-container">
                <div class="skeleton" style="height:54px; width:100%; margin-bottom:0.5rem;"></div>
              </div>
            </div>

            <!-- Products Preview -->
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.75rem;">
                <h3 style="margin:0; font-size:1.15rem; font-weight: 500;">Hardware Overview</h3>
                <a href="../dashboard/products.html" style="font-size:0.8rem; color:var(--accent-color); font-weight: 500;">View Directory</a>
              </div>
              <div id="products-preview-container">
                <div class="skeleton" style="height:76px; width:100%; margin-bottom:0.5rem;"></div>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div>
            <!-- Recent Activity Timeline -->
            <div style="background: rgba(255, 255, 255, 0.015); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 20px; padding: 2rem;">
              <h3 style="margin:0 0 1.5rem 0; font-size:1.15rem; font-weight: 500; display:flex; align-items:center; gap:0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Recent Activity
              </h3>
              <div id="activity-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="skeleton" style="height:48px; width:100%;"></div>
                <div class="skeleton" style="height:48px; width:100%;"></div>
                <div class="skeleton" style="height:48px; width:100%;"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/component-loader.js"></script>
  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
