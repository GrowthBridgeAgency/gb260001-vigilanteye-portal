<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Supabase Connection</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .status-box {
      padding: 1.5rem;
      border-radius: 8px;
      background-color: var(--border-color);
      font-weight: bold;
      font-size: 1.5rem;
      text-align: center;
      margin: 2rem 0;
      transition: var(--transition);
    }
    .status-connected {
      background-color: #dcfce3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-failed {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <!-- Navbar Placeholder (optional, keeping it simple for the test page) -->
  <div class="container" style="padding-top: 4rem;">
    <div class="card" style="max-width: 600px; margin: 0 auto; text-align: center;">
      <h1>Supabase Connection Test</h1>
      
      <div id="status-display" class="status-box">
        Testing Connection...
      </div>

      <div style="text-align: left; background: #f8fafc; padding: 1rem; border-radius: 4px; border: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 0.5rem; color: var(--primary-color);">Instructions:</h4>
        <ol style="margin-left: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
          <li>Open <code>js/supabase.js</code></li>
          <li>Replace <code>YOUR_SUPABASE_URL</code> with your Project URL</li>
          <li>Replace <code>YOUR_SUPABASE_ANON_KEY</code> with your Anon Key</li>
          <li>Refresh this page</li>
        </ol>
      </div>
    </div>
  </div>

  <!-- Load our Supabase JS configuration as an ES Module -->
  <script type="module">
    import { checkSupabaseConnection } from '/js/supabase.js';

    document.addEventListener("DOMContentLoaded", async () => {
      const statusDisplay = document.getElementById("status-display");
      
      // Perform the check
      const isConnected = await checkSupabaseConnection();

      // Update the UI
      if (isConnected) {
        statusDisplay.textContent = "✅ Connected";
        statusDisplay.className = "status-box status-connected";
      } else {
        statusDisplay.textContent = "❌ Failed";
        statusDisplay.className = "status-box status-failed";
      }
    });
  </script>
</body>
</html>
