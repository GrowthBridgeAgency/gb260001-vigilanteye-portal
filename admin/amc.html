<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMC Tracking | SafeVision Surveillance Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    /* Metric Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .metric-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 600;
      color: #fff;
      font-family: var(--font-family-headline);
    }
    .metric-success { color: #86efac; }
    .metric-warning { color: #fcd34d; }
    .metric-danger { color: #fca5a5; }
    .metric-highlight { color: #7dd3fc; }

    /* Upcoming Renewals Panel */
    .renewals-panel {
      background: rgba(125, 211, 252, 0.05);
      border: 1px solid rgba(125, 211, 252, 0.2);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    body[data-theme="light"] .metric-card { background: #fff; border-color: rgba(0,0,0,0.05); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    body[data-theme="light"] .metric-value { color: #000; }
  </style>
  <meta name="view-transition" content="same-origin">
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="admin-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="admin-header-placeholder"></div>
      
      <div class="dashboard-content">
        <h1 style="margin-top: 0; margin-bottom: 1.5rem;">AMC Tracking</h1>

        <!-- Dashboard Summary -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-title">Active AMC</div>
            <div class="metric-value metric-success" id="metric-active">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Expiring in 30 Days</div>
            <div class="metric-value metric-warning" id="metric-expiring">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Expired AMC</div>
            <div class="metric-value metric-danger" id="metric-expired">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Potential Renewals This Month</div>
            <div class="metric-value metric-highlight" id="metric-renewals">0</div>
          </div>
        </div>

        <div class="table-container" style="padding: 0; overflow: hidden;">
          <div style="padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 1rem; align-items: center; justify-content: space-between;">
            <div style="position: relative; flex: 1; max-width: 400px;">
              <svg style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="search-input" class="form-control" placeholder="Search customer, product..." style="width: 100%; margin: 0; padding-left: 40px; border-radius: 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);">
            </div>
            <div class="filter-dropdown-container" style="position: relative;">
              <button id="filter-toggle-btn" class="btn btn-outline" style="border-radius: 20px; padding: 0.5rem 1.25rem; display: flex; align-items: center; gap: 0.5rem; border: 1px solid rgba(255,255,255,0.2);">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                Filters
              </button>
              <div id="filter-dropdown-menu" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 0.75rem; background: #0B1B32; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; width: 320px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); z-index: 100; flex-direction: column; gap: 1.25rem;">

                <div>
                  <label style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; display: block; text-transform: uppercase; letter-spacing: 0.05em;">Status</label>
                  <select id="filter-status" class="form-control" style="width: 100%; margin: 0; background: rgba(0,0,0,0.2);">
                    <option value="All">All AMCs</option>
                    <option value="Active">Active</option>
                    <option value="Expiring Soon">Expiring Soon</option>
                    <option value="Expired">Expired</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div style="overflow-x: auto;">
            <table class="data-table" id="amc-table">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Product</th>
                  <th>AMC Start</th>
                  <th>AMC Expiry</th>
                  <th>Status</th>
                  <th style="text-align: center;">Renew</th>
                </tr>
              </thead>
              <tbody id="amc-tbody">
                <tr><td colspan="6" style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading AMC records...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/component-loader.js"></script>
  <script type="module" src="../js/admin-amc.js"></script>
</body>
</html>
