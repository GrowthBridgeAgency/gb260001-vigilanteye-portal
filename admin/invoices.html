<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Invoices | VigilantEye Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* Metric Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .metric-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 600;
      color: #fff;
      font-family: var(--font-family-headline);
    }
    .metric-success { color: #86efac; }
    .metric-warning { color: #fca5a5; }

    /* Dynamic Invoice Items */
    .invoice-item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 40px;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: end;
      padding-bottom: 1rem;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .invoice-total-row {
      display: flex;
      justify-content: flex-end;
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 1rem;
    }

    body[data-theme="light"] .metric-card { background: #fff; border-color: rgba(0,0,0,0.05); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    body[data-theme="light"] .metric-value { color: #000; }
    body[data-theme="light"] .invoice-item-row { border-bottom-color: rgba(0,0,0,0.1); }
  </style>
  <meta name="view-transition" content="same-origin">
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="admin-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="admin-header-placeholder"></div>
      
      <div class="dashboard-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <h1 style="margin: 0;">Invoices</h1>
          <button class="btn btn-primary" onclick="window.openCreateModal()">+ Create Invoice</button>
        </div>

        <!-- Dashboard Summary -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-title">Total Invoices</div>
            <div class="metric-value" id="metric-total">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Total Revenue</div>
            <div class="metric-value metric-success" id="metric-revenue">₹0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Paid Invoices</div>
            <div class="metric-value" id="metric-paid">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Unpaid Invoices</div>
            <div class="metric-value metric-warning" id="metric-unpaid">0</div>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 1rem; flex-wrap: wrap;">
            <input type="text" id="search-input" class="form-control" placeholder="Search number, customer..." style="width: 250px; margin: 0;">
            <select id="filter-status" class="form-control" style="width: 150px; margin: 0;">
              <option value="All">All Status</option>
              <option value="Paid">Paid</option>
              <option value="Unpaid">Unpaid</option>
            </select>
          </div>
          <div style="overflow-x: auto;">
            <table class="data-table" id="invoices-table">
              <thead>
                <tr>
                  <th>Invoice Number</th>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="invoices-tbody">
                <tr><td colspan="6" style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading invoices...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- CREATE INVOICE MODAL -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-content" style="max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="flex-shrink: 0;">
        <h2>Create Invoice</h2>
        <button class="modal-close" onclick="window.closeModal('create-modal')">&times;</button>
      </div>
      <div class="modal-body" style="overflow-y: auto; padding: 1.5rem;">
        <form id="create-form">
          <div class="grid-2" style="gap: 1.5rem; margin-bottom: 1.5rem;">
            <div>
              <label>Customer *</label>
              <select id="invoice_customer" class="form-control" required>
                <option value="">Select Customer...</option>
              </select>
            </div>
            <div>
              <label>Invoice Date *</label>
              <input type="date" id="invoice_date" class="form-control" required>
            </div>
          </div>

          <div class="grid-2" style="gap: 1.5rem; margin-bottom: 2rem;">
            <div>
              <label>Status</label>
              <select id="invoice_status" class="form-control" required>
                <option value="Unpaid">Unpaid</option>
                <option value="Paid">Paid</option>
              </select>
            </div>
            <div>
              <label>PDF Invoice (Optional)</label>
              <input type="file" id="invoice_pdf" class="form-control" accept="application/pdf">
            </div>
          </div>

          <div style="margin-bottom: 2rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
              <h3 style="margin:0; font-size:1.1rem;">Invoice Items</h3>
              <button type="button" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size:0.8rem;" onclick="window.addInvoiceItem()">+ Add Row</button>
            </div>
            
            <div id="invoice-items-container">
              <!-- JS will inject rows here -->
            </div>
            
            <div class="invoice-total-row">
              Total: ₹<span id="invoice_grand_total">0.00</span>
            </div>
          </div>

          <div>
            <label>Notes (Optional)</label>
            <textarea id="invoice_notes" class="form-control" rows="3" placeholder="Thank you for your business."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="flex-shrink: 0;">
        <button class="btn btn-outline" onclick="window.closeModal('create-modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-save-invoice">Generate Invoice</button>
      </div>
    </div>
  </div>

  <!-- DETAILS MODAL -->
  <div class="modal-overlay" id="details-modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="details-title">Invoice Details</h2>
        <button class="modal-close" onclick="window.closeModal('details-modal')">&times;</button>
      </div>
      <div class="modal-body" id="details-body" style="padding: 1.5rem;">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <script src="/js/component-loader.js"></script>
  <script type="module" src="/js/admin-invoices.js"></script>
  <script>
    window.openModal = function(id) { document.getElementById(id).classList.add('active'); }
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
