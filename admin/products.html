<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Product Catalog | VigilantEye Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="admin-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="admin-header-placeholder"></div>
      
      <div class="dashboard-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <h1 style="margin: 0;">Product Catalog</h1>
          
          <div style="display:flex; gap:1rem; align-items:center;">
            <!-- Search & Filters -->
            <input type="text" id="search-input" class="form-control" placeholder="Search by name, brand..." style="width: 250px; margin-top: 0;">
            <select id="featured-filter" class="form-control" style="width: 150px; margin-top: 0;">
              <option value="all">All Products</option>
              <option value="featured">Featured Only</option>
            </select>
            <!-- Add Button -->
            <button class="btn btn-primary" id="btn-add-product" style="white-space: nowrap;">+ Add Product</button>
          </div>
        </div>

        <!-- Table Card -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table class="data-table" id="products-table">
              <thead>
                <tr>
                  <th style="width: 70px;">Image</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Brand</th>
                  <th>Model</th>
                  <th>Featured</th>
                  <th style="width: 120px; text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                    Loading products...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add New Product</h2>
        <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="product_id" name="id">
          
          <!-- Image Upload & Preview -->
          <div class="image-preview-container" id="image-preview-box">
            <span style="color: var(--text-muted); font-size: 0.9rem;" id="image-preview-text">No image selected</span>
            <img id="image-preview-img" style="display:none;" />
          </div>
          <label>Product Image</label>
          <input type="file" id="product_image" name="product_image" class="form-control" accept="image/*" style="margin-bottom: 1.5rem;">
          <input type="hidden" id="existing_image_url" name="existing_image_url">

          <div class="grid-2" style="gap: 1rem;">
            <div>
              <label>Product Name *</label>
              <input type="text" id="product_name" name="product_name" class="form-control" required>
            </div>
            <div>
              <label>Category</label>
              <input type="text" id="category" name="category" class="form-control" placeholder="e.g. CCTV">
            </div>
            <div>
              <label>Brand</label>
              <input type="text" id="brand" name="brand" class="form-control">
            </div>
            <div>
              <label>Model Number</label>
              <input type="text" id="model_number" name="model_number" class="form-control">
            </div>
            <div>
              <label>Price</label>
              <input type="text" id="price" name="price" class="form-control" placeholder="e.g. 15,000 INR">
            </div>
            <div>
              <label style="display:flex; align-items:center; height: 100%; padding-top: 1.5rem; gap: 0.5rem; cursor:pointer;">
                <input type="checkbox" id="featured" name="featured" style="width:auto; margin:0;">
                Featured Product
              </label>
            </div>
          </div>

          <label style="margin-top: 1rem;">Short Description</label>
          <input type="text" id="short_description" name="short_description" class="form-control" maxlength="255">

          <label>Full Description</label>
          <textarea id="full_description" name="full_description" class="form-control" rows="3"></textarea>

          <label>Specifications (Key-Value pairs or list)</label>
          <textarea id="specifications" name="specifications" class="form-control" rows="3"></textarea>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('product-modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-save-product">Save Product</button>
      </div>
    </div>
  </div>

  <!-- VIEW PRODUCT DETAILS MODAL -->
  <div class="modal-overlay" id="view-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Product Details</h2>
        <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
      </div>
      <div class="modal-body" id="view-modal-body" style="color: var(--text-muted); line-height: 1.6;">
        <!-- Injected via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('view-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>Confirm Deletion</h2>
        <button class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
      </div>
      <div class="modal-body text-center">
        <p style="color: var(--text-muted);">Are you sure you want to delete this product? This action cannot be undone.</p>
        <input type="hidden" id="delete_product_id">
        <input type="hidden" id="delete_image_url">
      </div>
      <div class="modal-footer" style="justify-content: center;">
        <button class="btn btn-outline" onclick="closeModal('delete-modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-delete" style="background: #ef4444; border-color: #ef4444;">Delete Product</button>
      </div>
    </div>
  </div>

  <script src="/js/component-loader.js"></script>
  <script type="module" src="/js/admin-products.js"></script>
  
  <!-- Global Modal UI Helpers -->
  <script>
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }
  </script>
</body>
</html>
