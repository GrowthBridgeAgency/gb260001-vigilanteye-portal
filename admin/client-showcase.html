<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Showcase Management | SafeVision Surveillance</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <meta name="view-transition" content="same-origin">
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="admin-sidebar-placeholder"></div>
    <main class="dashboard-main">
      <div id="admin-header-placeholder"></div>
      
      <div class="dashboard-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
          <div>
            <h1 style="margin: 0;">Client Showcase</h1>
            <p style="margin: 0.25rem 0 0 0; color: var(--text-muted);">Manage portfolio projects and trusted installations.</p>
          </div>
          <button class="btn btn-primary" onclick="window.openCreateModal()">+ Add Project</button>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-title">Total Projects</div>
            <div class="metric-value" id="metric-total">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Featured Projects</div>
            <div class="metric-value" id="metric-featured" style="color: #fcd34d;">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Cities Covered</div>
            <div class="metric-value" id="metric-cities" style="color: #93c5fd;">0</div>
          </div>
        </div>

        <div class="table-container" style="margin-top: 2rem;">
          <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <input type="text" id="search-input" class="form-control" placeholder="Search by client, project, or location..." style="flex: 1;">
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Project Name</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Date Added</th>
                  <th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody id="projects-tbody">
                <tr><td colspan="6" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading projects...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="modal-title" style="margin-top:0;">Add Project</h2>
        <button class="modal-close" onclick="window.closeModal('project-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="project-form">
          <input type="hidden" id="proj_id">
          
          <div class="grid-2">
            <div class="form-group">
              <label>Client Name *</label>
              <input type="text" id="proj_client" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Project Name *</label>
              <input type="text" id="proj_name" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label>Location *</label>
            <input type="text" id="proj_location" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Short Description (Used on cards) *</label>
            <input type="text" id="proj_short" class="form-control" maxlength="150" required placeholder="Brief summary...">
          </div>

          <div class="form-group">
            <label>Full Project Details</label>
            <textarea id="proj_details" class="form-control" rows="4" placeholder="Detailed scope of work, challenges, solutions..."></textarea>
          </div>

          <div class="form-group">
            <label>Project Image (JPG/PNG)</label>
            <input type="file" id="proj_image" class="form-control" accept="image/jpeg, image/png">
            <div id="proj_image_preview" style="margin-top:0.5rem; display:none;">
              <img src="" style="max-width:100%; max-height:200px; border-radius:8px;">
            </div>
          </div>

          <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="proj_featured" style="width:auto; height:auto;">
            <label for="proj_featured" style="margin:0; cursor:pointer;">Mark as Featured (Displays on Homepage)</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="window.closeModal('project-modal')">Cancel</button>
        <button type="submit" form="project-form" class="btn btn-primary" id="btn-save">Save Project</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="../js/component-loader.js"></script>
  <script type="module" src="../js/toast.js"></script>
  <script type="module" src="../js/admin-client-showcase.js"></script>
  <script>
    window.openModal = function(id) { document.getElementById(id).classList.add('active'); }
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
