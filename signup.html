<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigilantEye | Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .message-box {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
    }
    .message-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .message-success {
      background-color: #dcfce3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    .form-control {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container" style="padding-top: 2rem; max-width: 400px;">
    <div class="card">
      <h1 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h1>
      
      <!-- Reusable Message Container -->
      <div id="signup-message" class="message-box"></div>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="signup-phone" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" class="form-control" required minlength="8" placeholder="Minimum 8 characters">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-control" required minlength="8">
        </div>
        <button type="submit" id="signup-btn" class="btn" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/component-loader.js"></script>
  <!-- Load auth.js as a module -->
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
