<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | VigilantEye Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    body {
      background: radial-gradient(circle at 50% 50%, #0d111d 0%, #030407 100%);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8rem 1.5rem 4rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.08);
    }
    .login-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.25rem;
      font-weight: 500;
      margin: 0 0 0.5rem 0;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .login-card p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 2rem 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: #fff;
      padding: 0.9rem 1.15rem;
      font-size: 0.95rem;
      font-family: var(--font-family);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }
    .form-control:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--accent-color);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), 0 0 15px rgba(56, 189, 248, 0.15);
      outline: none;
    }
    .form-group:focus-within label {
      color: var(--accent-color);
    }

    .btn-submit {
      background: #fff;
      color: #030407;
      border: none;
      padding: 0.95rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
      width: 100%;
      font-family: 'Outfit', sans-serif;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background: var(--accent-color);
      color: #fff;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25);
      transform: translateY(-2px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      background: rgba(255, 255, 255, 0.2) !important;
      color: rgba(255, 255, 255, 0.4) !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .message-box {
      padding: 0.9rem 1.15rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: none;
      font-size: 0.9rem;
      text-align: left;
      line-height: 1.4;
    }
    .message-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .message-success {
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="login-container">
    <div class="login-card">
      <h1>Create Account</h1>
      <p class="subtitle">Join VigilantEye to secure your properties</p>
      
      <!-- Reusable Message Container -->
      <div id="signup-message" class="message-box"></div>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="signup-phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-control" placeholder="••••••••" required minlength="8">
        </div>
        <button type="submit" id="signup-btn" class="btn-submit">Register</button>
      </form>
      <p style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: var(--accent-color); font-weight: 500;">Login</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/component-loader.js"></script>
  <!-- Load auth.js as a module -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
