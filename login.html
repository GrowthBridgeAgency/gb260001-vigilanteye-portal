<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SafeVision Surveillance Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    body {
      background: radial-gradient(circle at 50% 50%, #0d111d 0%, #0B1B32 100%);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8rem 1.5rem 4rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-card:hover {
      border-color: rgba(255, 107, 0, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 107, 0, 0.08);
    }
    .login-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.25rem;
      font-weight: 500;
      margin: 0 0 0.5rem 0;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .login-card p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 2rem 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: #fff;
      padding: 0.9rem 1.15rem;
      font-size: 0.95rem;
      font-family: var(--font-family);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }
    .form-control:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--accent-color);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 107, 0, 0.15);
      outline: none;
    }
    .form-group:focus-within label {
      color: var(--accent-color);
    }

    .btn-submit {
      background: #fff;
      color: #0B1B32;
      border: none;
      padding: 0.95rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
      width: 100%;
      font-family: 'Outfit', sans-serif;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background: var(--accent-color);
      color: #fff;
      box-shadow: 0 8px 25px rgba(255, 107, 0, 0.25);
      transform: translateY(-2px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      background: rgba(255, 255, 255, 0.2) !important;
      color: rgba(255, 255, 255, 0.4) !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .message-box {
      padding: 0.9rem 1.15rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: none;
      font-size: 0.9rem;
      text-align: left;
      line-height: 1.4;
    }
    .message-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .message-success {
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="login-container">
    <div class="login-card">
      <h1>Login</h1>
      <p class="subtitle">Access your security dashboard</p>
      
      <!-- Reusable Message Container -->
      <div id="login-message" class="message-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="padding-right: 2.5rem; width: 100%;">
            <button type="button" onclick="const input = document.getElementById('login-password'); const isPwd = input.type === 'password'; input.type = isPwd ? 'text' : 'password'; this.innerHTML = isPwd ? '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>' : '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>';" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; height: 100%;">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn-submit">Login</button>
      </form>
      <p style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="signup.html" style="color: var(--accent-color); font-weight: 500;">Sign Up</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/component-loader.js"></script>
  <!-- Load auth.js as a module -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
